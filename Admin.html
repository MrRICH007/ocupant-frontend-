<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocupant Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --primary-blue: #0066FF; --primary-blue-light: #4D94FF;
    --dark-bg: #0a0a0f; --card-bg: #111118; --surface: #1a1a24; --surface-light: #222230;
    --text-primary: #fff; --text-secondary: #a0a0b0; --text-muted: #6b6b7b;
    --border: #2a2a3a; --success: #00c853; --danger: #ff1744; --warning: #ff9100;
    --gold: #FFB800;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: var(--text-primary); min-height: 100vh; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 4px; }

.topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
}
.brand { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; }
.brand span { color: var(--primary-blue); }
.badge-admin { background: var(--gold); color: #000; font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 20px; margin-left: 10px; vertical-align: middle; }

.btn { padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: all 0.25s; display: inline-flex; align-items: center; gap: 7px; }
.btn-primary { background: var(--primary-blue); color: #fff; }
.btn-primary:hover { background: var(--primary-blue-light); }
.btn-outline { background: transparent; color: var(--primary-blue); border: 2px solid var(--primary-blue); }
.btn-outline:hover { background: var(--primary-blue); color: #fff; }
.btn-danger { background: rgba(255,23,68,0.12); color: var(--danger); border: 1px solid rgba(255,23,68,0.4); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 0.4rem 0.8rem; font-size: 0.78rem; }

.container { max-width: 1300px; margin: 0 auto; padding: 2rem; }

.tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
.tab { padding: 0.6rem 1.3rem; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.tab.active { background: var(--primary-blue); color: #fff; border-color: var(--primary-blue); }

.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { text-align: left; padding: 0.9rem 1rem; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--surface); }
.thumb { width: 56px; height: 40px; object-fit: cover; border-radius: 6px; }
.pill { padding: 0.2rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
.pill.vacant { background: rgba(0,200,83,0.12); color: var(--success); }
.pill.occupied { background: rgba(255,23,68,0.12); color: var(--danger); }
.pill.successful { background: rgba(0,200,83,0.12); color: var(--success); }
.pill.pending { background: rgba(255,145,0,0.12); color: var(--warning); }
.pill.failed { background: rgba(255,23,68,0.12); color: var(--danger); }
.row-actions { display: flex; gap: 0.4rem; }
.muted { color: var(--text-muted); }

/* Login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 400px; }
.login-card h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.4rem; }
.login-card p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }

.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600; }
.field input, .field select, .field textarea {
    width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-primary); font-size: 0.9rem; outline: none; font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary-blue); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
.form-grid .full { grid-column: 1 / -1; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center; padding: 3rem 1rem; z-index: 200; overflow-y: auto; }
.modal-overlay.active { display: flex; }
.modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 640px; padding: 2rem; position: relative; }
.modal h2 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 1.5rem; }
.modal-close { position: absolute; top: 1.2rem; right: 1.2rem; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; }
.modal-close:hover { background: var(--danger); color: #fff; }

.toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.3rem; display: flex; gap: 0.8rem; align-items: center; z-index: 300; transform: translateX(150%); transition: transform 0.4s; }
.toast.show { transform: translateX(0); }
.toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.toast-icon.success { background: rgba(0,200,83,0.15); color: var(--success); }
.toast-icon.error { background: rgba(255,23,68,0.15); color: var(--danger); }
.toast h4 { font-size: 0.95rem; } .toast p { font-size: 0.82rem; color: var(--text-secondary); }

@media (max-width: 760px) { .form-grid { grid-template-columns: 1fr; } .container { padding: 1rem; } table { font-size: 0.8rem; } th, td { padding: 0.6rem 0.5rem; } }
</style>
</head>
<body>

<!-- Login view -->
<div class="login-wrap" id="loginView">
    <div class="login-card">
        <h1>Ocu<span style="color: var(--primary-blue);">pan</span>t Admin<span class="badge-admin">ADMIN</span></h1>
        <p>Sign in with an admin account to manage listings and payments.</p>
        <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@ocupant.com"></div>
        <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="admin1234" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="adminLogin()">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <p class="muted" style="margin-top:1.2rem;font-size:0.8rem;">Demo: admin@ocupant.com / admin1234</p>
    </div>
</div>

<!-- Dashboard view -->
<div id="dashboardView" style="display:none;">
    <div class="topbar">
        <div class="brand">Ocu<span>pan</span>t Admin</div>
        <div style="display:flex;gap:0.8rem;align-items:center;">
            <span class="muted" id="adminName"></span>
            <button class="btn btn-outline btn-sm" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="container">
        <div class="tabs">
            <button class="tab active" id="tabHouses" onclick="showTab('houses')"><i class="fas fa-home"></i> Listings</button>
            <button class="tab" id="tabPayments" onclick="clickPaymentsTab()"><i class="fas fa-credit-card"></i> Payments</button>
        </div>

        <div class="card" id="housesPanel">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--border);">
                <strong id="housesCount"></strong>
                <button class="btn btn-primary btn-sm" onclick="openHouseForm()"><i class="fas fa-plus"></i> Add Property</button>
            </div>
            <div style="overflow-x:auto;">
            <table>
                <thead><tr><th></th><th>Title</th><th>Location</th><th>Type</th><th>Status</th><th>1st Year</th><th>Owner</th><th>Actions</th></tr></thead>
                <tbody id="housesTbody"></tbody>
            </table>
            </div>
        </div>

        <div class="card" id="paymentsPanel" style="display:none;">
            <div style="padding:1rem 1.2rem;border-bottom:1px solid var(--border);"><strong>Recent payments</strong></div>
            <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>Date</th><th>Customer</th><th>tx_ref</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody id="paymentsTbody"></tbody>
            </table>
            </div>
        </div>
    </div>
</div>

<!-- House form modal -->
<div class="modal-overlay" id="houseFormModal">
    <div class="modal">
        <button class="modal-close" onclick="closeHouseForm()"><i class="fas fa-times"></i></button>
        <h2 id="houseFormTitle">Add Property</h2>
        <div class="form-grid">
            <div class="field full"><label>Title *</label><input id="fTitle"></div>
            <div class="field"><label>Exact location *</label><input id="fLocation" placeholder="Beverly Hills, California"></div>
            <div class="field"><label>Generic location * (shown to Basic users)</label><input id="fGenericLocation" placeholder="West Coast, USA"></div>
            <div class="field"><label>Type *</label>
                <select id="fType"><option>Bedsitter</option><option>Self-Contain</option><option>Two Bedroom</option><option>Three Bedroom</option></select>
            </div>
            <div class="field"><label>Status</label>
                <select id="fStatus"><option value="vacant">Vacant</option><option value="occupied">Occupied</option></select>
            </div>
            <div class="field"><label>Beds</label><input id="fBeds" type="number" min="0" value="1"></div>
            <div class="field"><label>Baths</label><input id="fBaths" type="number" min="0" value="1"></div>
            <div class="field"><label>Area</label><input id="fArea" placeholder="1,200 sqft"></div>
            <div class="field"><label>Image URL</label><input id="fImage" placeholder="https://..."></div>
            <div class="field"><label>First-year price (USD) *</label><input id="fFirstPrice" type="number" min="0"></div>
            <div class="field"><label>Subsequent price (USD) *</label><input id="fSubsequentPrice" type="number" min="0"></div>
            <div class="field"><label>Owner name *</label><input id="fOwnerName"></div>
            <div class="field"><label>Owner phone *</label><input id="fOwnerPhone" placeholder="+1 (555) 000-0000"></div>
            <div class="field"><label>Owner WhatsApp * (digits only, country code)</label><input id="fOwnerWhatsapp" placeholder="15550000000"></div>
            <div class="field full"><label>Description</label><textarea id="fDescription" rows="2"></textarea></div>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem;" onclick="saveHouse()">
            <i class="fas fa-save"></i> Save Property
        </button>
    </div>
</div>

<div class="toast" id="toast">
    <div class="toast-icon" id="toastIcon"><i class="fas fa-check"></i></div>
    <div><h4 id="toastTitle">Done</h4><p id="toastMessage"></p></div>
</div>

<script>
const API_URL = 'http://localhost:4000/api';
let token = localStorage.getItem('ocupant_admin_token');
let editingId = null;
let housesCache = [];

async function api(path, options = {}) {
    const res = await fetch(API_URL + path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(options.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    return data;
}

function showToast(title, message, type) {
    const t = document.getElementById('toast');
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMessage').textContent = message;
    const icon = document.getElementById('toastIcon');
    icon.className = 'toast-icon ' + type;
    icon.innerHTML = type === 'success' ? '<i class="fas fa-check"></i>' : '<i class="fas fa-exclamation-circle"></i>';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
}

async function adminLogin() {
    try {
        const data = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email: document.getElementById('loginEmail').value.trim(), password: document.getElementById('loginPassword').value })
        });
        if (!data.user.is_admin) throw new Error('This account is not an admin.');
        token = data.token;
        localStorage.setItem('ocupant_admin_token', token);
        showDashboard(data.user);
    } catch (e) { showToast('Login failed', e.message, 'error'); }
}

function adminLogout() {
    localStorage.removeItem('ocupant_admin_token');
    token = null;
    document.getElementById('dashboardView').style.display = 'none';
    document.getElementById('loginView').style.display = 'flex';
}

async function showDashboard(user) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'block';
    document.getElementById('adminName').textContent = user ? user.name : '';
    await loadHouses();
}

async function loadHouses() {
    try {
        // Admin sees everything; request with admin token returns full data.
        const data = await api('/houses');
        housesCache = data.houses;
        document.getElementById('housesCount').textContent = data.houses.length + ' properties';
        const tb = document.getElementById('housesTbody');
        tb.innerHTML = '';
        data.houses.forEach(h => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img class="thumb" src="${h.image || ''}" alt=""></td>
                <td><strong>${h.title}</strong></td>
                <td>${h.location}</td>
                <td>${h.type}</td>
                <td><span class="pill ${h.status}">${h.status}</span></td>
                <td>$${Number(h.firstYearPrice).toLocaleString()}</td>
                <td>${h.owner ? h.owner.name : ''}</td>
                <td><div class="row-actions">
                    <button class="btn btn-outline btn-sm" onclick="openHouseForm(${h.id})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="deleteHouse(${h.id})"><i class="fas fa-trash"></i></button>
                </div></td>`;
            tb.appendChild(tr);
        });
    } catch (e) { showToast('Load failed', e.message, 'error'); }
}

function openHouseForm(id) {
    editingId = id || null;
    document.getElementById('houseFormTitle').textContent = id ? 'Edit Property' : 'Add Property';
    const h = id ? housesCache.find(x => x.id === id) : null;
    const val = (k, v) => document.getElementById(k).value = (v === undefined || v === null ? '' : v);
    val('fTitle', h ? h.title : '');
    val('fLocation', h ? h.location : '');
    val('fGenericLocation', h ? h.genericLocation || '' : '');
    val('fType', h ? h.type : 'Bedsitter');
    val('fStatus', h ? h.status : 'vacant');
    val('fBeds', h ? h.beds : 1);
    val('fBaths', h ? h.baths : 1);
    val('fArea', h ? h.area : '');
    val('fImage', h ? h.image : '');
    val('fFirstPrice', h ? h.firstYearPrice : '');
    val('fSubsequentPrice', h ? h.subsequentPrice : '');
    val('fOwnerName', h && h.owner ? h.owner.name : '');
    val('fOwnerPhone', h && h.owner ? h.owner.phone : '');
    val('fOwnerWhatsapp', h && h.owner ? h.owner.whatsapp : '');
    val('fDescription', h ? h.description : '');
    document.getElementById('houseFormModal').classList.add('active');
}

function closeHouseForm() { document.getElementById('houseFormModal').classList.remove('active'); }

async function saveHouse() {
    const g = (id) => document.getElementById(id).value.trim();
    const body = {
        title: g('fTitle'), location: g('fLocation'), genericLocation: g('fGenericLocation'),
        type: g('fType'), status: g('fStatus'),
        beds: Number(g('fBeds') || 0), baths: Number(g('fBaths') || 0), area: g('fArea'),
        image: g('fImage'), firstYearPrice: Number(g('fFirstPrice')), subsequentPrice: Number(g('fSubsequentPrice')),
        ownerName: g('fOwnerName'), ownerPhone: g('fOwnerPhone'), ownerWhatsapp: g('fOwnerWhatsapp'),
        description: g('fDescription')
    };
    try {
        if (editingId) {
            await api('/houses/' + editingId, { method: 'PUT', body: JSON.stringify(body) });
        } else {
            await api('/houses', { method: 'POST', body: JSON.stringify(body) });
        }
        closeHouseForm();
        await loadHouses();
        showToast('Saved', 'Property ' + (editingId ? 'updated' : 'created') + ' successfully.', 'success');
    } catch (e) { showToast('Save failed', e.message, 'error'); }
}

async function deleteHouse(id) {
    if (!confirm('Delete this property? This cannot be undone.')) return;
    try {
        await api('/houses/' + id, { method: 'DELETE' });
        await loadHouses();
        showToast('Deleted', 'Property removed.', 'success');
    } catch (e) { showToast('Delete failed', e.message, 'error'); }
}

function showTab(name) {
    document.getElementById('tabHouses').classList.toggle('active', name === 'houses');
    document.getElementById('tabPayments').classList.toggle('active', name === 'payments');
    document.getElementById('housesPanel').style.display = name === 'houses' ? 'block' : 'none';
    document.getElementById('paymentsPanel').style.display = name === 'payments' ? 'block' : 'none';
}

async function clickPaymentsTab() {
    showTab('payments');
    try {
        const data = await api('/payments');
        const tb = document.getElementById('paymentsTbody');
        tb.innerHTML = '';
        if (!data.payments.length) {
            tb.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:2rem;">No payments yet.</td></tr>';
            return;
        }
        data.payments.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${p.created_at}</td>
                <td><strong>${p.name}</strong><br><span class="muted" style="font-size:0.78rem;">${p.email}</span></td>
                <td style="font-family:monospace;font-size:0.78rem;">${p.tx_ref}</td>
                <td>${p.currency} ${Number(p.amount).toLocaleString()}</td>
                <td><span class="pill ${p.status}">${p.status}</span></td>`;
            tb.appendChild(tr);
        });
    } catch (e) { showToast('Load failed', e.message, 'error'); }
}

// Restore admin session on load
document.addEventListener('DOMContentLoaded', async () => {
    if (!token) return;
    try {
        const { user } = await api('/auth/me');
        if (!user.is_admin) throw new Error('not admin');
        showDashboard(user);
    } catch { adminLogout(); }
});

document.getElementById('houseFormModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeHouseForm();
});
</script>
</body>
</html>
